# Pipeline de pruebas de rendimiento · Tiquetmania
# Levanta la API (api/) en el puerto 8080 y ejecuta el plan de JMeter (pruebas/jmeter/) en modo no-GUI.
# El job queda en rojo si un paso falla o si el .jtl registra peticiones fallidas.
name: rendimiento

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prueba-rendimiento:
    runs-on: ubuntu-latest   # máquina virtual Linux nueva y vacía en cada ejecución

    steps:
      # 1. Descarga el código del commit (API y plan juntos: monorepo)
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2. JMeter 5.6.3 necesita Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. JMeter no viene instalado en la máquina virtual. Se guarda en caché:
      #    la primera ejecución lo descarga y las siguientes lo reutilizan.
      - name: Restaurar JMeter desde la caché
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ~/apache-jmeter-5.6.3
          key: jmeter-5.6.3

      # Descarga del CDN oficial de Apache (rápido). archive.apache.org guarda todas las versiones,
      # pero limita mucho la velocidad (tardó ~20 min); solo se usa si el CDN falla.
      # Se verifica la firma SHA-512 antes de descomprimir.
      - name: Instalar JMeter 5.6.3
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          ARCHIVO=apache-jmeter-5.6.3.tgz
          wget -q "https://dlcdn.apache.org/jmeter/binaries/$ARCHIVO" \
            || wget -q "https://archive.apache.org/dist/jmeter/binaries/$ARCHIVO"
          wget -q "https://downloads.apache.org/jmeter/binaries/$ARCHIVO.sha512" \
            || wget -q "https://archive.apache.org/dist/jmeter/binaries/$ARCHIVO.sha512"
          sha512sum -c "$ARCHIVO.sha512"
          tar -xzf "$ARCHIVO" -C "$HOME"

      # Deja "jmeter" disponible para los pasos siguientes
      - name: Agregar JMeter al PATH
        run: echo "$HOME/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      # 4. La API es un proceso de larga duración: se deja en segundo plano (&)
      - name: Levantar la API en el puerto 8080
        run: nohup python3 api/ticketmania_simple.py > api.log 2>&1 &

      # 5. La prueba empieza solo cuando /api/salud responde (máximo 30 s)
      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/salud; then
              echo " La API responde"
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondió en 30 segundos"
          cat api.log
          exit 1

      # 6. Modo no-GUI desde la carpeta del plan, para que encuentre datos.csv (ruta relativa)
      - name: Ejecutar el plan de JMeter
        working-directory: pruebas/jmeter
        run: jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      # 7. JMeter no falla solo cuando una petición responde mal:
      #    este paso cuenta las muestras con success=false en el .jtl y deja el job en rojo si hay alguna
      - name: Revisar peticiones fallidas en el .jtl
        working-directory: pruebas/jmeter
        run: |
          python3 - <<'EOF'
          import csv, sys
          with open("resultados.jtl", newline="", encoding="utf-8") as f:
              filas = list(csv.DictReader(f))
          fallidas = [f for f in filas if f["success"].strip().lower() != "true"]
          print(f"Muestras: {len(filas)} · Fallidas: {len(fallidas)}")
          for f in fallidas[:20]:
              print(f"  {f['label']}: {f['responseCode']} {f['responseMessage']} {f.get('failureMessage', '')}")
          if not filas:
              sys.exit("El .jtl no tiene muestras")
          if fallidas:
              sys.exit(f"{len(fallidas)} peticiones fallidas")
          EOF

      # 8. El reporte se sube siempre, también si el paso anterior falló
      - name: Subir el reporte de rendimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rendimiento
          path: pruebas/jmeter/reporte/
          retention-days: 14
